spring.application.name=jogo
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/critical_hit?currentSchema=jogo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=postgres

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=jogo

spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.schemas=jogo
spring.flyway.default-schema=jogo
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health

logging.level.org.flywaydb=DEBUG